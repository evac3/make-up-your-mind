services:
  # ── Database & Analytics Microservice (port 8001) ──────────────────────────
  db-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # CMD from Dockerfile: uvicorn app.main:app --port 8001
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    volumes:
      # Persist SQLite + DuckDB + Parquet files across container restarts
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── AI Gateway / Chat Service (port 8000) ──────────────────────────────────
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override so the gateway talks to the db-service container, not localhost
      - DB_BASE_URL=http://db-service:8001
    depends_on:
      db-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  backend-data:
